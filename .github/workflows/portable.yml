name: Portable core and serial transport
on: [push, pull_request]
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build
      - run: cmake --build build --config Debug
      - run: cmake -S . -B build-core -DCMCP_BUILD_SERIAL=OFF -DCMCP_BUILD_TESTS=ON
      - run: cmake --build build-core --config Debug
      - run: ctest --test-dir build-core -C Debug --output-on-failure
