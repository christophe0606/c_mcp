name: Host tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        serial: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build/host -DCMCP_BUILD_SERIAL=${{ matrix.serial }} -DCMCP_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host --parallel --config Debug
      - run: ctest --test-dir build/host -C Debug --output-on-failure
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-mcp-serial-bridge.txt
      - run: python tests/test_serial_bridge.py -v
